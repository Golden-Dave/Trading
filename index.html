<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XAU/USD Panel</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: neon title, two glowing stands (robot = blue, manual = orange), each with a 4-button pedestal; single dark theme by choice */
:root{
  --bg:#03040b; --bg2:#070a1c; --fg:#eaf1ff; --muted:#8e9cc2;
  --blue:#1f8cff; --blue-hi:#79d4ff; --blue-deep:#06123a;
  --orange:#ff7417; --orange-hi:#ffc457; --orange-deep:#2a0d03;
  --gold:#ffd23c; --win:#2fe28c; --loss:#ff4d61; --line:rgba(255,255,255,.12);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 25% 30%,#06123a 0%,transparent 60%),radial-gradient(1200px 600px at 78% 30%,#2a0c02 0%,transparent 60%),var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1280px;margin:0 auto}

/* top bar */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;min-height:34px}
.who{color:var(--muted);font-size:13px}
.who b{color:var(--fg)}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.banner{margin:8px auto 0;max-width:1280px;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}

/* neon title */
.title{font-family:var(--f-display);font-weight:800;text-align:center;font-size:clamp(46px,9vw,118px);line-height:1;letter-spacing:.04em;margin:6px 0 18px;
  color:transparent;-webkit-text-stroke:2.5px #fff3b0;
  text-shadow:0 0 6px #ffcc33,0 0 18px #ffb000,0 0 42px #ff9a00,0 0 80px rgba(255,140,0,.6)}
@media (prefers-reduced-motion:no-preference){.title{animation:flick 6s infinite}}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.75}94%{opacity:1}96%{opacity:.85}}

/* stands */
.stands{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,44px)}
@media (max-width:900px){.stands{grid-template-columns:1fr}}
.stand{--c:var(--blue);--hi:var(--blue-hi);--deep:var(--blue-deep);position:relative;min-width:0;padding-top:34px}
.stand.manual{--c:var(--orange);--hi:var(--orange-hi);--deep:var(--orange-deep)}
.screen{position:relative;border:3px solid var(--hi);border-radius:34px;min-height:520px;padding:22px 22px 120px;
  background:radial-gradient(120% 80% at 50% 10%,color-mix(in srgb,var(--deep) 90%,#000) 0%,#020308 100%);
  box-shadow:0 0 8px var(--c),0 0 26px var(--c),inset 0 0 26px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 90px color-mix(in srgb,var(--c) 18%,transparent)}
.mascot{position:absolute;top:-40px;width:110px;height:120px;z-index:2;pointer-events:none}
.robot .mascot{left:36px}
.manual .mascot{right:36px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-inline:clamp(0px,9vw,120px) 0}
.manual .shead{padding-inline:0 clamp(0px,9vw,120px)}
.shead h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--hi);text-shadow:0 0 12px var(--c);letter-spacing:.02em}
.src{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--muted)}
.src:hover{color:var(--hi);border-color:var(--hi)}
.content{margin-top:14px;min-width:0}

/* pedestal */
.pedestal{position:absolute;left:-14px;right:-14px;bottom:-22px;height:66px;border-radius:50%/40%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 30%,#000),#05060c);
  border:2px solid var(--hi);box-shadow:0 0 18px var(--c),inset 0 6px 18px color-mix(in srgb,var(--hi) 35%,transparent)}
.btns{position:absolute;left:0;right:0;bottom:-14px;display:grid;grid-template-columns:repeat(4,1fr);z-index:3;padding-inline:8px}
.btn{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.orb{width:clamp(58px,7vw,86px);aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;border:3px solid var(--hi);
  background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 55%,#000),#04050c 75%);
  box-shadow:0 0 10px var(--c),inset 0 0 14px color-mix(in srgb,var(--c) 60%,transparent);transition:transform .15s,box-shadow .2s}
.orb svg{width:52%;height:52%;fill:var(--hi);filter:drop-shadow(0 0 6px var(--c))}
.btn span{font-family:var(--f-display);font-weight:700;font-size:clamp(14px,1.6vw,19px);color:#fff;text-shadow:0 0 8px var(--c),0 0 2px var(--hi)}
.btn:hover .orb{transform:translateY(-3px)}
.btn[aria-pressed="true"] .orb{box-shadow:0 0 14px var(--hi),0 0 38px var(--c),inset 0 0 22px var(--hi);background:radial-gradient(circle at 50% 40%,var(--c),#04050c 80%)}
.btn[aria-pressed="true"] .orb svg{fill:#fff}
.reflect{height:46px}

/* content blocks */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{border:1px solid color-mix(in srgb,var(--hi) 35%,transparent);border-radius:16px;padding:14px 16px;background:rgba(0,0,0,.28);min-width:0}
.tile .k{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--f-mono);font-weight:600;font-size:clamp(20px,2.4vw,28px);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .s{font-size:13px;color:var(--muted);margin-top:2px}
.tile.wide{grid-column:1/-1}
.pos{color:var(--win)} .neg{color:var(--loss)}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:12px 2px 0}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--hi) 45%,transparent);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 0 10px var(--c)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.empty{border:1px dashed color-mix(in srgb,var(--hi) 40%,transparent);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);line-height:1.6}

/* forms */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:700;min-width:0}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=url],select,textarea{
  background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12px;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.act{border:1px solid var(--gold);background:rgba(255,210,60,.1);color:var(--gold);border-radius:10px;padding:9px 16px;font-weight:700}
.act:hover{background:rgba(255,210,60,.2)}
.act.ghost{border-color:var(--line);color:var(--fg);background:rgba(255,255,255,.04)}
.act.danger{border-color:var(--loss);color:var(--loss);background:rgba(255,77,97,.08)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.split{display:flex;height:16px;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:8px 0 4px}
.split i{display:block;height:100%}
input[type=range]{width:100%;accent-color:var(--c)}
.wd{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin:6px 0 0;padding:0;list-style:none}
.wd li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:4px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#111528;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:12px;z-index:50;font-weight:700;max-width:90vw}

/* login */
.auth{max-width:420px;margin:4vh auto 0;border:3px solid var(--blue-hi);border-radius:28px;padding:28px 24px;
  box-shadow:0 0 10px var(--blue),0 0 30px var(--blue),inset 0 0 30px rgba(31,140,255,.25);background:#030616;display:grid;gap:14px}
.auth h3{margin:0;font-family:var(--f-display);font-size:26px;color:var(--blue-hi);text-shadow:0 0 10px var(--blue)}
.auth p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}
.err{color:var(--loss);font-size:14px;min-height:1em}

/* admin */
.overlay{position:fixed;inset:0;background:rgba(2,3,9,.86);z-index:30;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.admin{max-width:1100px;margin:0 auto;border:2px solid var(--gold);border-radius:24px;background:#070913;box-shadow:0 0 30px rgba(255,190,40,.25);padding:20px}
.admin h3{margin:0;font-family:var(--f-display);font-size:26px;color:var(--gold)}
.admin h4{margin:18px 0 8px;font-family:var(--f-display);font-size:18px;color:var(--fg)}
.agrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;margin-top:14px}
@media (max-width:780px){.agrid{grid-template-columns:1fr}}
.ulist{display:flex;flex-direction:column;gap:6px}
.ubtn{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:10px 12px}
.ubtn[aria-current="true"]{border-color:var(--gold);background:rgba(255,210,60,.08)}
.ubtn small{display:block;color:var(--muted);font-size:12px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 0 0}
</style>

/* ---------- formatting ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function pct(v,sign){if(!isFinite(v))return "—";return (sign&&v>0?"+":"")+(v<0?"−":"")+Math.abs(v).toLocaleString("cs-CZ",{minimumFractionDigits:2,maximumFractionDigits:2})+" %"}

/* ---------- calculations ---------- */
function stats(u,side){
  var S=u.settings,T=u.transfer;
  var share=side==="robot"?+T.robotPct:100-T.robotPct;
  var base=(+S.capital||0)*share/100;
  var start=new Date(S.start).getTime()||0,coef=+S.coef;if(!isFinite(coef))coef=1;
  var tr=(u.trades[side]||[]).filter(function(t){return new Date(t.t).getTime()>=start}).sort(function(a,b){return new Date(a.t)-new Date(b.t)})
    .map(function(t){return Object.assign({},t,{adj:t.profit>0?t.profit*coef:t.profit})});
  var pnl=0,w=0,l=0;tr.forEach(function(t){pnl+=t.adj;if(t.profit>0)w++;else if(t.profit<0)l++});
  var wd=(T.withdrawals||[]).filter(function(x){return x.side===side}).reduce(function(a,x){return a+(+x.amount||0)},0);
  var mb=side==="robot"?S.robotBalance:S.manualBalance;
  return {base:base,share:share,trades:tr,pnl:pnl,wins:w,losses:l,wd:wd,current:base+pnl-wd,
    winrate:tr.length?w/tr.length*100:NaN,coef:coef,start:start,manualBal:mb===""||mb==null?null:+mb};
}
function periodStart(d,per){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(per==="week"){x.setDate(x.getDate()-(x.getDay()+6)%7)}
  if(per==="month")x.setDate(1);
  if(per==="year"){x.setMonth(0);x.setDate(1)}
  return x;
}
function bucketLabel(d,per){if(per==="day"||per==="week")return dmy(d);if(per==="month")return pad(d.getMonth()+1)+"."+d.getFullYear();return String(d.getFullYear())}
function buckets(st,per){
  var map={},order=[];
  st.trades.forEach(function(t){var s=periodStart(new Date(t.t),per),k=s.getTime();
    if(!map[k]){map[k]={start:s,profit:0,pips:0,lots:0,n:0};order.push(k)}
    var b=map[k];b.profit+=t.adj;b.pips+=(+t.pips||0);b.lots+=(+t.lots||0);b.n++});
  order.sort(function(a,b){return a-b});
  var bal=st.base;
  return order.map(function(k){var b=map[k];b.pct=bal>0?b.profit/bal*100:NaN;b.label=bucketLabel(b.start,per);bal+=b.profit;return b});
}

async function onAuth(user){
  if(creatingAdmin)return;
  adminOpen=false;if(ov){ov.remove();ov=null}
  if(!user){
    session=null;DB.users=[];viewId=null;
    try{var a=await fs.collection("meta").doc("admin").get();needSetup=!a.exists}catch(e){return renderMsg("Chyba připojení",esc(errText(e)))}
    return render();
  }
  renderMsg("Načítám…","Stahuji data účtu.");
  try{
    var p=await userRef(user.uid).get();
    if(!p.exists){loginErr="Tento účet byl zrušen nebo nemá přístup.";await auth.signOut();return}
    var mine=await loadUserFull(p);DB.users=[mine];
    if(mine.isAdmin){var all=await fs.collection("users").get();DB.users=await Promise.all(all.docs.map(loadUserFull))}
    session=user.uid;render();
  }catch(e){renderMsg("Chyba načítání",esc(errText(e))+'<br><br><button class="act" onclick="location.reload()">Zkusit znovu</button>')}
}

function viewGraf(u,side,st){
  var s=ui[side];

  if(!st.trades.length)return head+noData();
  var b=buckets(st,s.per).slice(-7);
  return head+'<div class="chart">'+chartSVG(b,s.unit)+'</div><p class="note">Posledních '+b.length+' '+({day:"obchodních dnů",week:"týdnů",month:"měsíců",year:"let"})[s.per]+' s obchody. Částka nad sloupcem je výsledek v dolarech.</p>';

function chartSVG(b,unit){
  var W=640,H=330,L=60,R=14,T=34,B=46;
  var vals=b.map(function(x){return unit==="pct"?x.pct:unit==="pips"?x.pips:unit==="lot"?x.lots:x.profit}).map(function(v){return isFinite(v)?v:0});
  var mn=Math.min(0,Math.min.apply(null,vals)),mx=Math.max(0,Math.max.apply(null,vals));if(mn===mx)mx=1;
  var step=niceStep((mx-mn)/5),lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  var y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)};
  var axisCol="rgba(234,241,255,.55)",grid="rgba(255,255,255,.08)";
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sloupcový graf výsledků">',dec=step<1?(step<0.1?2:1):0;
  for(var v=lo;v<=hi+step/2;v+=step){var yy=y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+(Math.abs(v)<1e-9?axisCol:grid)+'"/>'+
    '<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="11" fill="'+axisCol+'">'+num(v,dec)+(unit==="pct"?"%":unit==="usd"?"$":"")+'</text>'}
  g+='<text x="10" y="18" font-family="Nunito,sans-serif" font-size="12" font-weight="700" fill="'+axisCol+'">'+{pct:"%",pips:"pips",lot:"lot",usd:"USD"}[unit]+'</text>';
  var slot=(W-L-R)/Math.max(b.length,1),bw=Math.min(54,slot*0.58);
  b.forEach(function(x,i){var v=vals[i],cx=L+slot*(i+.5),y0=y(0),y1=y(v),top=Math.min(y0,y1),hgt=Math.max(Math.abs(y1-y0),1.5);
    var col=x.profit>=0?"#2fe28c":"#ff4d61";
    g+='<rect x="'+(cx-bw/2)+'" y="'+top+'" width="'+bw+'" height="'+hgt+'" rx="4" fill="'+col+'" fill-opacity=".85" style="filter:drop-shadow(0 0 6px '+col+')"/>';
    g+='<text x="'+cx+'" y="'+(v>=0?top-7:top+hgt+15)+'" text-anchor="middle" font-family="IBM Plex Mono,monospace" font-size="11.5" font-weight="600" fill="'+col+'">'+usd(x.profit,true).replace(",00","")+'</text>';
    g+='<text x="'+cx+'" y="'+(H-B+20)+'" text-anchor="middle" font-family="Nunito,sans-serif" font-size="11.5" fill="'+axisCol+'">'+x.label+'</text>'});
  return g+'</svg>';
}
function niceStep(r){if(r<=0)return 1;var p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function viewObch(u,side,st){
  var per=ui[side].tper;
  var head='<div class="ctrls">'+seg(side,"tper",[["day","Denní"],["week","Týdenní"],["month","Měsíční"],["year","Roční"]])+'</div>';
  if(!st.trades.length)return head+noData();
  var b=buckets(st,per),pcts=b.map(function(x){return x.pct}).filter(isFinite);

  var curKey=periodStart(new Date(),per).getTime(),cur=b.find(function(x){return x.start.getTime()===curKey});
  var best=pcts.length?Math.max.apply(null,pcts):NaN,worst=pcts.length?Math.min.apply(null,pcts):NaN;
  var bestB=b.find(function(x){return x.pct===best}),worstB=b.find(function(x){return x.pct===worst});
  var sumP=pcts.reduce(function(a,v){return a+v},0);
  var word={day:"den",week:"týden",month:"měsíc",year:"rok"}[per],cw={day:"dnes",week:"tento týden",month:"tento měsíc",year:"letos"}[per];

   tile("Návratnost – "+cw,'<span class="'+cls(cur?cur.pct:0)+'">'+pct(cur?cur.pct:0,true)+'</span>',"průměr za "+word+": "+pct(pcts.length?sumP/pcts.length:NaN,true))+
   tile("Celková návratnost",'<span class="'+cls(st.pnl)+'">'+pct(st.base?st.pnl/st.base*100:NaN,true)+'</span>',b.length+" období ("+word+")")+

   tile("Max. ztráta za "+word,'<span class="neg">'+pct(worst<0?worst:NaN,true)+'</span>',worstB&&worst<0?worstB.label+" · "+usd(worstB.profit,true):"bez ztrátového období")+
   '</div>';
}

function slHint(T,cap){
  if(T.slUnit!=="%")return "";
  var r=+T.slRobot,m=+T.slManual,rp=+T.robotPct,p=[];
  if(r)p.push("robot ≈ "+usd(cap*rp/100*r/100));if(m)p.push("manuál ≈ "+usd(cap*(100-rp)/100*m/100));

/* ---------- import parsing ---------- */
function toNum(s){if(s==null)return NaN;s=String(s).replace(/[\s $]/g,"");if(/^-?[\d.]*,\d+$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");return parseFloat(s)}
function toDate(s){
  s=String(s||"").trim();if(!s)return null;var m;
  if(m=s.match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/))return new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  if(m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))return new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))return new Date(+m[3],m[1]-1,+m[2],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  var d=new Date(s);return isNaN(d)?null:d;
}
function rowsFromText(txt){
  if(/<table/i.test(txt)){var doc=new DOMParser().parseFromString(txt,"text/html"),out=[];
    doc.querySelectorAll("tr").forEach(function(tr){var cells=[];tr.querySelectorAll("th,td").forEach(function(c){var n=+(c.getAttribute("colspan")||1);cells.push(c.textContent.trim());for(var i=1;i<n;i++)cells.push("")});out.push(cells)});return out}
  var lines=txt.split(/\r?\n/).filter(function(l){return l.trim()});if(!lines.length)return [];
  var first=lines[0],d=first.split("\t").length>1?"\t":first.split(";").length>first.split(",").length?";":",";
  return lines.map(function(l){var r=[],cur="",q=false;for(var i=0;i<l.length;i++){var c=l[i];if(c==='"'){q=!q;continue}if(c===d&&!q){r.push(cur.trim());cur="";continue}cur+=c}r.push(cur.trim());return r});
}
function parseTrades(txt){
  var rows=rowsFromText(txt),res=[],col=null;
  for(var i=0;i<rows.length;i++){
    var r=rows[i],low=r.map(function(c){return c.toLowerCase()});
    if(low.some(function(c){return /^(profit|zisk|net profit|p\/l)$/.test(c)})&&low.some(function(c){return /time|date|datum|čas/.test(c)})){
      col={time:[],price:[]};
      low.forEach(function(c,j){
        if(/close.?(time|date)|čas uzav/.test(c))col.close=j;
        else if(/open.?(time|date)/.test(c))col.time.push(j);
        else if(/^(time|date|datum|čas)$/.test(c))col.time.push(j);
        if(/symbol|^item$|instrument|nástroj/.test(c))col.sym=j;
        if(/^(type|action|direction|typ|směr)$/.test(c))col.type=j;
        if(/volume|^lots?$|^units|objem|size/.test(c)&&col.vol==null)col.vol=j;
        if(/^pips?$/.test(c))col.pips=j;
        if(/^(profit|zisk|net profit|p\/l)$/.test(c))col.profit=j;
        if(/commission|komise|provize/.test(c))col.comm=j;
        if(/^swap/.test(c))col.swap=j;
        if(/close.?price/.test(c))col.cprice=j;else if(/open.?price/.test(c))col.oprice=j;else if(/^price$|^cena$/.test(c))col.price.push(j);
      });
      if(col.close==null&&col.time.length>1)col.close=col.time[col.time.length-1];
      if(col.close==null)col.close=col.time[0];
      if(col.oprice==null&&col.price.length)col.oprice=col.price[0];
      if(col.cprice==null&&col.price.length>1)col.cprice=col.price[col.price.length-1];
      continue;
    }
    if(!col)continue;
    var profit=toNum(r[col.profit]);if(!isFinite(profit))continue;
    var type=col.type!=null?String(r[col.type]||"").toLowerCase():"";
    if(col.type!=null&&!/buy|sell|nákup|prodej/.test(type))continue;
    if(col.sym!=null&&!/xau|gold/i.test(r[col.sym]||""))continue;
    var dt=toDate(r[col.close]);if(!dt)continue;
    if(col.comm!=null&&isFinite(toNum(r[col.comm])))profit+=toNum(r[col.comm]);
    if(col.swap!=null&&isFinite(toNum(r[col.swap])))profit+=toNum(r[col.swap]);
    var lots=col.vol!=null?toNum(r[col.vol]):0,pips=col.pips!=null?toNum(r[col.pips]):NaN;
    if(!isFinite(pips)&&col.oprice!=null&&col.cprice!=null){var op=toNum(r[col.oprice]),cp=toNum(r[col.cprice]);if(isFinite(op)&&isFinite(cp))pips=(cp-op)*(/sell|prodej/.test(type)?-1:1)/0.1}
    res.push({t:dt.toISOString(),side:/sell|prodej/.test(type)?"sell":"buy",lots:isFinite(lots)?lots:0,pips:isFinite(pips)?Math.round(pips*10)/10:0,profit:Math.round(profit*100)/100});
  }
  return res;
}
function demoTrades(seed,edge){
  var out=[],d=new Date();d.setHours(0,0,0,0);var x=seed;function rnd(){x=(x*9301+49297)%233280;return x/233280}
  for(var i=900;i>=0;i--){var day=new Date(d);day.setDate(d.getDate()-i);var wd=day.getDay();if(wd===0||wd===6)continue;
    var n=Math.floor(rnd()*4);for(var k=0;k<n;k++){var win=rnd()<edge,lots=Math.round((0.05+rnd()*0.25)*100)/100,pips=Math.round((win?20+rnd()*140:-(20+rnd()*170))*10)/10;
      var t=new Date(day);t.setHours(8+Math.floor(rnd()*12),Math.floor(rnd()*60));
      out.push({t:t.toISOString(),side:rnd()<.5?"buy":"sell",lots:lots,pips:pips,profit:Math.round(pips*lots*10*100)/100})}}
  return out;
}

function closeOv(){adminOpen=false;if(ov){ov.remove();ov=null}if(session)renderMain()}
var armed={};
function arm(btn,key,label,fn){if(armed[key]){clearTimeout(armed[key]);armed[key]=null;fn();return}btn.textContent=label;armed[key]=setTimeout(function(){armed[key]=null;if(adminOpen)renderAdmin()},4000)}
function msg(m){var el=document.getElementById("iMsg");if(el)el.textContent=m}
async function adminClick(e){
  var b=e.target.closest("button");if(!b)return;var x=b.dataset.x;if(!x)return;e.preventDefault();
  var sel=DB.users.find(function(u){return u.id===adminSel});
  if(x==="close")return closeOv();
  if(x==="sel"){adminSel=b.dataset.id;return renderAdmin()}
  if(x==="view"){viewId=sel.id===me().id?null:sel.id;return closeOv()}
  if(x==="del")return arm(b,"del","Opravdu smazat "+sel.username+"?",async function(){
    try{await userRef(sel.id).collection("trades").doc("robot").delete();await userRef(sel.id).collection("trades").doc("manual").delete();await userRef(sel.id).delete()}catch(err){return fail(err)}
    DB.users=DB.users.filter(function(u){return u.id!==sel.id});if(viewId===sel.id)viewId=null;adminSel=me().id;renderAdmin();renderMain();toast("Účet "+sel.username+" smazán.")});
  if(x==="clr"){var side=val("iSide");return arm(b,"clr","Opravdu smazat ("+(side==="robot"?"robot":"manuál")+")?",async function(){sel.trades[side]=[];await persistTrades(sel,side);renderAdmin();renderMain();toast("Obchody smazány.")})}
  if(x==="export"){var s=JSON.stringify({users:DB.users.map(function(u){return {username:u.username,settings:u.settings,transfer:u.transfer,trades:u.trades}})});
    try{await navigator.clipboard.writeText(s);toast("Záloha zkopírována do schránky.")}catch(err){var t=document.getElementById("bk");t.value=s;t.select();toast("Záloha je v poli, zkopírujte ji.")}return}
  if(x==="import"){var d;try{d=JSON.parse(val("bk"));if(!d||!Array.isArray(d.users))throw 0}catch(err){toast("Záloha není platná.");return}
    var ok=0,miss=[];
    for(var i=0;i<d.users.length;i++){var src=d.users[i],tgt=DB.users.find(function(u){return u.username.toLowerCase()===String(src.username||"").toLowerCase()});
      if(!tgt){miss.push(src.username);continue}
      if(src.settings)tgt.settings=Object.assign(tgt.settings,src.settings);if(src.transfer)tgt.transfer=Object.assign(tgt.transfer,src.transfer);
      if(src.trades){tgt.trades.robot=src.trades.robot||[];tgt.trades.manual=src.trades.manual||[]}
      await userRef(tgt.id).update({settings:tgt.settings,transfer:tgt.transfer}).catch(fail);await persistTrades(tgt,"robot");await persistTrades(tgt,"manual");ok++}
    renderAdmin();renderMain();toast("Obnoveno účtů: "+ok+(miss.length?". Nenalezeno: "+miss.join(", "):""));return}
  if(x==="demo"){var side2=val("iSide");sel.trades[side2]=demoTrades(side2==="robot"?7:19,side2==="robot"?.66:.58);await persistTrades(sel,side2);renderAdmin();renderMain();toast("Ukázková data vložena.");return}
  if(x==="imp"){var f=document.getElementById("iFile").files[0],txt=val("iTxt");if(f)txt=await f.text();if(!txt.trim()){msg("Vyberte soubor nebo vložte obsah.");return}return applyImport(sel,txt)}
  if(x==="fetch"){var sd=val("iSide"),url=sd==="robot"?sel.settings.robotUrl:sel.settings.manualUrl;if(!url){msg("Pro tento stojánek není zadaný odkaz.");return}
    msg("Načítám…");try{var r=await fetch(url);if(!r.ok)throw new Error(r.status);await applyImport(sel,await r.text())}catch(err){msg("Stránku se nepodařilo načíst. Server odkazu nepovoluje čtení z jiné stránky. Otevřete odkaz, uložte export a nahrajte ho jako soubor.")}}
}
async function applyImport(sel,txt){
  var side=val("iSide"),t=parseTrades(txt);
  if(!t.length){msg("Nenašel jsem žádné obchody XAUUSD. Tabulka musí mít sloupce s časem a ziskem (Profit).");return}
  if(document.getElementById("iRepl").checked)sel.trades[side]=t;
  else{var seen={};sel.trades[side].forEach(function(o){seen[o.t+"|"+o.profit+"|"+o.lots]=1});t.forEach(function(o){if(!seen[o.t+"|"+o.profit+"|"+o.lots])sel.trades[side].push(o)})}
  await persistTrades(sel,side);renderAdmin();renderMain();msg("Importováno "+t.length+" obchodů.");toast("Importováno "+t.length+" obchodů.");
}

      var c=await sec.auth().createUserWithEmailAndPassword(emailOf(n),val("nP")),id=c.user.uid;await sec.auth().signOut();

    await persistSettings(sel);renderAdmin();renderMain();toast("Nastavení uloženo.")}
}
