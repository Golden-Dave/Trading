<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>XAU/USD Panel</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%230b0f24%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2243%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%20Black%2CArial%2CHelvetica%2Csans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2230%22%20textLength%3D%2258%22%20lengthAdjust%3D%22spacingAndGlyphs%22%20fill%3D%22%23ffd23c%22%20stroke%3D%22%23ffb000%22%20stroke-width%3D%22.8%22%3EAUX%3C/text%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: the user's neon artwork is the stage — title on top, blue robot stand left, orange wizard stand right; content lives inside the glass panels, the painted orbs are the buttons. Single dark theme by choice. */
:root{
  --bg:#03040b; --fg:#f2f6ff; --muted:#9fb0d6;
  --blue:#1f8cff; --blue-hi:#8fdcff;
  --orange:#ff7417; --orange-hi:#ffd27a;
  --gold:#ffd23c; --win:#35f29a; --loss:#ff5a6e; --line:rgba(255,255,255,.14);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 20px}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1680px;margin:0 auto}

/* top bar */
.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;min-height:34px;margin-bottom:6px}
.who{color:var(--muted);font-size:13px}
.who b{color:var(--fg)}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.chip:hover{border-color:var(--gold);color:var(--gold)}
.banner{margin:0 auto 8px;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:8px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}

/* stage */
.scene{position:relative}
.titleimg{display:block;width:min(92%,560px);aspect-ratio:1130/262;margin:0 auto -4px;background:var(--img-title) center/100% 100% no-repeat;
  -webkit-mask-image:radial-gradient(ellipse 62% 75% at 50% 45%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 62% 75% at 50% 45%,#000 62%,transparent 100%)}
.titleimg span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stands{display:grid;grid-template-columns:1fr;gap:6px}
@media (min-width:760px){
  .stands{grid-template-columns:1fr 1fr;gap:0}
  .titleimg{position:absolute;top:0;left:calc(405/1920*100%);width:calc(1130/1920*100%);margin:0;z-index:2;pointer-events:none;-webkit-mask-image:none;mask-image:none}
}
@media (prefers-reduced-motion:no-preference){.titleimg{animation:flick 7s infinite}}
@keyframes flick{0%,93%,100%{opacity:1}94%{opacity:.8}95%{opacity:1}97%{opacity:.88}}

.stand{--c:var(--blue);--hi:var(--blue-hi);--u:calc(100cqw/960);container-type:inline-size;min-width:0;position:relative;display:flex;flex-direction:column}
.stand.manual{--c:var(--orange);--hi:var(--orange-hi)}
.frame{flex:1;position:relative;display:flex;flex-direction:column;min-height:calc(var(--u)*1080);
  border-style:solid;border-width:0;border-color:transparent;
  border-image-source:var(--img-robot);border-image-slice:420 0 380 0 fill;border-image-width:calc(var(--u)*420) 0 calc(var(--u)*380) 0;border-image-repeat:stretch;
  padding:calc(var(--u)*348) calc(var(--u)*62) calc(var(--u)*304) calc(var(--u)*92)}
.manual .frame{border-image-source:var(--img-manual);padding-left:calc(var(--u)*66);padding-right:calc(var(--u)*88)}
.shead{position:absolute;top:calc(var(--u)*284);left:calc(var(--u)*330);right:calc(var(--u)*62);height:calc(var(--u)*56);display:flex;align-items:center;justify-content:space-between;gap:10px}
.manual .shead{left:calc(var(--u)*66);right:calc(var(--u)*330)}
.manual .shead{flex-direction:row-reverse}
.robot .shead{right:calc(var(--u)*58)}
.manual .shead{left:calc(var(--u)*62)}
.shead h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(14px,calc(var(--u)*30),30px);color:#fff;text-shadow:0 0 10px var(--c),0 0 2px var(--hi);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{font-size:clamp(11px,calc(var(--u)*17),15px);color:var(--hi);text-decoration:none;border-bottom:1px dashed currentColor;white-space:nowrap}
.src:hover{color:#fff}
button.src{background:none;border:0;border-bottom:1px dashed currentColor;padding:0;cursor:pointer;font:inherit;font-size:clamp(11px,calc(var(--u)*17),15px)}
.tl{position:fixed;inset:0;z-index:40;background:rgba(2,3,9,.82);display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tlbox{--c:var(--blue);--hi:var(--blue-hi);width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;border:2px solid var(--hi);border-radius:22px;background:#04060f;
  box-shadow:0 0 14px var(--c),0 0 40px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 22%,transparent)}
.tlbox.manual{--c:var(--orange);--hi:var(--orange-hi)}
.tlhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px 10px}
.tlhead h3{margin:0;font-family:var(--f-display);font-size:22px;color:#fff;text-shadow:0 0 10px var(--c)}
.tlx{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:20px;line-height:1;color:var(--fg)}
.tlx:hover{border-color:var(--hi);color:var(--hi)}
.tlsum{display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 18px 10px;font-size:13px;color:var(--muted)}
.tlsum b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.tlsum b.pos{color:var(--win)}.tlsum b.neg{color:var(--loss)}
.tlscroll{overflow:auto;padding:0 18px;min-height:0}
.tlt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tlt th{position:sticky;top:0;background:#04060f;text-align:right;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:8px 8px;border-bottom:1px solid var(--line)}
.tlt td{text-align:right;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-family:var(--f-mono);white-space:nowrap}
.tlt th:first-child,.tlt td:first-child,.tlt th:nth-child(2),.tlt td:nth-child(2){text-align:left}
.tlt tr:hover td{background:rgba(255,255,255,.04)}
.tlt tr.tlgap td{height:14px;padding:0;border-bottom:1px solid var(--line);background:none}
.tlfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px 14px;font-size:12.5px;color:var(--muted)}
.content{flex:1;min-height:0;min-width:0;font-size:clamp(11px,calc(var(--u)*19),18px);line-height:1.35}

/* painted orbs become buttons */
.btns{position:absolute;left:0;right:0;bottom:calc(var(--u)*80);height:calc(var(--u)*215)}
.hot{position:absolute;top:0;bottom:0;width:calc(var(--u)*180);background:none;border:0;padding:0;border-radius:24px}
.hot .ring{position:absolute;left:50%;top:calc(var(--u)*5);width:calc(var(--u)*136);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;transition:box-shadow .25s,background .25s,transform .15s;mix-blend-mode:screen}
.hot:hover .ring{background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);transform:translateX(-50%) scale(1.04)}
.hot[aria-pressed="true"] .ring{background:radial-gradient(circle,rgba(255,255,255,.38) 0%,color-mix(in srgb,var(--hi) 30%,transparent) 45%,transparent 72%);
  box-shadow:0 0 0 2px rgba(255,255,255,.75),0 0 calc(var(--u)*22) calc(var(--u)*6) var(--c),0 0 calc(var(--u)*60) calc(var(--u)*14) var(--c)}
.hot:focus-visible{outline-offset:-4px}
.robot .h0{left:calc(var(--u)*93)}.robot .h1{left:calc(var(--u)*302)}.robot .h2{left:calc(var(--u)*508)}.robot .h3{left:calc(var(--u)*715)}
.manual .h0{left:calc(var(--u)*70)}.manual .h1{left:calc(var(--u)*277)}.manual .h2{left:calc(var(--u)*484)}.manual .h3{left:calc(var(--u)*691)}

/* content blocks (sizes in em, scale with the stand) */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7em}
.tile{border:1px solid color-mix(in srgb,var(--hi) 38%,transparent);border-radius:.9em;padding:.7em .9em;background:rgba(0,0,0,.34);min-width:0;box-shadow:inset 0 0 1.2em color-mix(in srgb,var(--c) 18%,transparent)}
.tile .k{font-size:.72em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.tile .v{font-family:var(--f-mono);font-weight:600;font-size:1.5em;margin-top:.15em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-shadow:0 0 .5em rgba(255,255,255,.25)}
.tile .s{font-size:.8em;color:var(--muted);margin-top:.1em}
.tile.wide{grid-column:1/-1}
.pos{color:var(--win)} .neg{color:var(--loss)}
.note{font-size:.8em;color:var(--muted);line-height:1.5;margin:.7em .1em 0}
.seg{display:inline-flex;border:1px solid color-mix(in srgb,var(--hi) 50%,transparent);border-radius:999px;padding:.18em;gap:.1em;flex-wrap:wrap;background:rgba(0,0,0,.3)}
.seg button{border:0;background:none;padding:.3em .8em;border-radius:999px;font-size:.82em;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 0 .7em var(--c)}
.ctrls{display:flex;gap:.6em;flex-wrap:wrap;justify-content:space-between;margin-bottom:.5em}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:320px;height:auto}
.empty{border:1px dashed color-mix(in srgb,var(--hi) 45%,transparent);border-radius:1em;padding:1.4em 1em;text-align:center;color:var(--muted);line-height:1.6;background:rgba(0,0,0,.25)}

/* forms */
label.f{display:flex;flex-direction:column;gap:.3em;font-size:.82em;color:var(--muted);font-weight:700;min-width:0}
input[type=text],input[type=password],input[type=number],input[type=datetime-local],input[type=url],select,textarea{
  background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:.6em;padding:.5em .7em;font-size:1em;width:100%;min-width:0}
.content input,.content select{font-size:1.1em}
textarea{font-family:var(--f-mono);font-size:12px;min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7em}
.act{border:1px solid var(--gold);background:rgba(255,210,60,.12);color:var(--gold);border-radius:.6em;padding:.5em 1em;font-weight:700}
.act:hover{background:rgba(255,210,60,.22)}
.act.ghost{border-color:var(--line);color:var(--fg);background:rgba(255,255,255,.05)}
.act.danger{border-color:var(--loss);color:var(--loss);background:rgba(255,90,110,.08)}
.row{display:flex;gap:.6em;flex-wrap:wrap;align-items:center}
.split{display:flex;height:.9em;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:.4em 0 .2em}
.split i{display:block;height:100%}
input[type=range]{width:100%;accent-color:var(--c)}
/* jezdec rozdělení: vlevo modrá (robot), vpravo oranžová (manuál); kulička má barvu převažující strany, při 50 % napůl */
input.mix{-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:10px 0 4px;cursor:pointer}
input.mix::-webkit-slider-runnable-track{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0 var(--p),var(--orange) var(--p) 100%);box-shadow:0 0 10px rgba(31,140,255,.35),0 0 10px rgba(255,116,23,.25)}
input.mix::-moz-range-track{height:12px;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0 var(--p),var(--orange) var(--p) 100%)}
input.mix::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-8px;border-radius:50%;border:2px solid #fff;background:var(--thumb);box-shadow:0 0 12px var(--glow)}
input.mix::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:var(--thumb);box-shadow:0 0 12px var(--glow)}
input.mix:focus-visible{outline:none}
label.mixlab{display:block;line-height:1.5;font-size:13px}
.prevf label.f{font-size:13px}
.doact{justify-content:flex-end;font-size:13px}.doact .lbl{line-height:1}.doact .act{width:100%;padding:.62em 1em;font-size:15px}
.mixvals{position:relative;height:20px;margin-top:10px}
.mv{position:absolute;top:0;white-space:nowrap;font-family:var(--f-mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.mvb{color:var(--blue-hi);text-shadow:0 0 8px var(--blue)}.mvo{color:var(--orange-hi);text-shadow:0 0 8px var(--orange)}
.mixvals+input.mix{margin-top:2px}
input.mix:focus-visible::-webkit-slider-thumb{outline:2px solid var(--gold);outline-offset:2px}
.wd{font-family:var(--f-mono);font-size:.8em;color:var(--muted);margin:.4em 0 0;padding:0;list-style:none}
.wd li{display:flex;justify-content:space-between;gap:.5em;border-bottom:1px solid var(--line);padding:.2em 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#111528;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:12px;z-index:50;font-weight:700;max-width:90vw}

/* auth inside the blue stand */
.authf{display:grid;gap:.8em;max-width:26em}
.authf h3,.welcome h3{margin:0;font-family:var(--f-display);font-size:1.6em;line-height:1.1;color:#fff;text-shadow:0 0 .5em var(--c)}
.authf p,.welcome p{margin:0;color:var(--muted);line-height:1.5}
.welcome{display:grid;gap:.7em;max-width:26em}
.err{color:var(--loss);font-size:.9em;min-height:1em}

/* admin */
.overlay{position:fixed;inset:0;background:rgba(2,3,9,.88);z-index:30;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.admin{max-width:1100px;margin:0 auto;border:2px solid var(--gold);border-radius:24px;background:#070913;box-shadow:0 0 30px rgba(255,190,40,.25);padding:20px}
.admin h3{margin:0;font-family:var(--f-display);font-size:26px;color:var(--gold)}
.admin h4{margin:18px 0 8px;font-family:var(--f-display);font-size:18px;color:var(--fg)}
.admin .f{font-size:13px}
div.f{display:flex;flex-direction:column;gap:.3em;font-size:.82em;color:var(--muted);font-weight:700;min-width:0}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px}
.act.mini{padding:3px 10px;font-size:12px;border-radius:8px}
.act:disabled{opacity:.6;cursor:wait}
.agrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;margin-top:14px}
@media (max-width:780px){.agrid{grid-template-columns:1fr}}
.ulist{display:flex;flex-direction:column;gap:6px}
.ubtn{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:10px 12px}
.ubtn[aria-current="true"]{border-color:var(--gold);background:rgba(255,210,60,.08)}
.ubtn small{display:block;color:var(--muted);font-size:12px}
.box{border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 0 0}

/* ---------- calculations ---------- */
function stats(u,side){
  var S=u.settings,T=u.transfer;
  var share=side==="robot"?+T.robotPct:100-T.robotPct;
  var base=(+S.capital||0)*share/100;
  var start=new Date(S.start).getTime()||0,cv=side==="robot"?S.coefRobot:S.coefManual,coef=+(cv==null||cv===""?S.coef:cv);if(!isFinite(coef))coef=1;
  var tr=(u.trades[side]||[]).filter(function(t){return new Date(t.t).getTime()>=start}).sort(function(a,b){return new Date(a.t)-new Date(b.t)});
  /* koeficient se uplatní jen na čistý zisk: kladný celkový výsledek × koeficient, ztráta zůstává celá */
  function net(x){return x>0?x*coef:x}
  var pctMode=tr.length>0&&tr.every(function(t){return typeof t.pct==="number"&&isFinite(t.pct)});
  if(pctMode){
    /* Procentní režim: každý obchod nese % výnosu zdrojového účtu (vůči zůstatku na začátku dne).
       Stejná % se uplatní na peníze uživatele: v rámci dne se sčítají, mezi dny se úročí. */
    var eq=base,dayStart=base,dk="";
    tr=tr.map(function(t){var d=new Date(t.t),k=d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
      if(k!==dk){dk=k;dayStart=eq}
      var raw=dayStart*t.pct/100,adj=net(eq-base+raw)-net(eq-base);eq+=raw;
      return Object.assign({},t,{srcProfit:t.profit,profit:raw,adj:adj})});
  }else{
    var cum=0;tr=tr.map(function(t){var adj=net(cum+t.profit)-net(cum);cum+=t.profit;return Object.assign({},t,{adj:adj})});
  }
  var pnl=0,w=0,l=0;tr.forEach(function(t){pnl+=t.adj;if(t.profit>0)w++;else if(t.profit<0)l++});
  var wd=(T.withdrawals||[]).filter(function(x){return x.side===side}).reduce(function(a,x){return a+(+x.amount||0)},0);
  var mb=side==="robot"?S.robotBalance:S.manualBalance;
  return {base:base,share:share,trades:tr,pnl:pnl,wins:w,losses:l,wd:wd,current:base+pnl-wd,
    winrate:tr.length?w/tr.length*100:NaN,coef:coef,start:start,pctMode:pctMode,manualBal:mb===""||mb==null?null:+mb};
}
function periodStart(d,per){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(per==="week"){x.setDate(x.getDate()-(x.getDay()+6)%7)}
  if(per==="month")x.setDate(1);
  if(per==="year"){x.setMonth(0);x.setDate(1)}
  return x;
}
function bucketLabel(d,per){if(per==="day"||per==="week")return dmy(d);if(per==="month")return pad(d.getMonth()+1)+"."+d.getFullYear();return String(d.getFullYear())}
function buckets(st,per){
  var map={},order=[];
  st.trades.forEach(function(t){var s=periodStart(new Date(t.t),per),k=s.getTime();
    if(!map[k]){map[k]={start:s,profit:0,pips:0,lots:0,n:0};order.push(k)}
    var b=map[k];b.profit+=t.adj;b.pips+=(+t.pips||0);b.lots+=(+t.lots||0);b.n++});
  order.sort(function(a,b){return a-b});
  var bal=st.base;
  return order.map(function(k){var b=map[k];b.pct=bal>0?b.profit/bal*100:NaN;b.label=bucketLabel(b.start,per);bal+=b.profit;return b});
}

  '<label class="f">Uživatelské jméno<input type="text" id="sU" autocomplete="username" required></label>'+
  '<label class="f">Heslo (min. 6 znaků)<input type="password" id="sP" autocomplete="new-password" minlength="6" required></label>'+
  '<label class="f">Heslo znovu<input type="password" id="sP2" autocomplete="new-password" required></label><div class="err" id="sErr"></div><button class="act">Vytvořit a přihlásit</button></form>');
  document.getElementById("fSetup").addEventListener("submit",async function(e){e.preventDefault();

    if(!validName(n)){setErr("sErr","Jméno: 3–30 znaků, jen písmena bez diakritiky, číslice, tečka, pomlčka nebo podtržítko.");return}

function renderLogin(){

  loginErr="";
  document.getElementById("fLogin").addEventListener("submit",async function(e){e.preventDefault();
    var n=val("lU").trim();if(!validName(n)){setErr("lErr","Nesprávné jméno nebo heslo.");return}
    busy(e.target,true);
    try{await auth.signInWithEmailAndPassword(emailOf(n),val("lP"))}catch(err){busy(e.target,false);setErr("lErr",errText(err))}
  });

async function onAuth(user){
  if(creatingAdmin)return;
  adminOpen=false;if(ov){ov.remove();ov=null}
  if(!user){
    session=null;DB.users=[];viewId=null;
    try{var a=await fs.collection("meta").doc("admin").get();needSetup=!a.exists}catch(e){return renderMsg("Chyba připojení",esc(errText(e)))}
    return render();
  }
  renderMsg("Načítám…","Stahuji data účtu.");
  try{
    var p=await userRef(user.uid).get();
    if(!p.exists){loginErr="Tento účet byl zrušen nebo nemá přístup.";await auth.signOut();return}
    var mine=await loadUserFull(p);DB.users=[mine];
    if(mine.isAdmin){var all=await fs.collection("users").get();DB.users=await Promise.all(all.docs.map(loadUserFull))}
    session=user.uid;render();autoRefresh();scheduleHourly();
  }catch(e){renderMsg("Chyba načítání",esc(errText(e))+'<br><br><button class="act" onclick="location.reload()">Zkusit znovu</button>')}
}

  var btns='<div class="btns">'+tabs.map(function(t,i){return '<button class="hot h'+i+'" data-side="'+side+'" data-tab="'+t[0]+'" aria-pressed="'+(s.tab===t[0])+'" aria-label="'+t[1]+'" title="'+t[1]+'"><span class="ring"></span></button>'}).join("")+'</div>';

function tile(k,v,s,wide){return '<div class="tile'+(wide?' wide':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'}

function viewGraf(u,side,st){

  var head='<div class="ctrls">'+seg(side,"unit",[["pct","%"],["usd","$"],["lot","Lot"],["pips","Pips"]])+seg(side,"per",[["day","Dny"],["week","Týdny"],["month","Měsíce"],["year","Roky"]])+'</div>';
  if(!st.trades.length)return head+noData();
  var b=buckets(st,s.per).slice(-7);
  return head+'<div class="chart">'+chartSVG(b,s.unit)+'</div><p class="note">Posledních '+b.length+' '+({day:"obchodních dnů",week:"týdnů",month:"měsíců",year:"let"})[s.per]+' s obchody. Hodnota nad sloupcem je ve zvolené jednotce.</p>';
}
function chartSVG(b,unit){
  var W=640,H=262,L=70,R=10,T=34,B=44;
  var vals=b.map(function(x){return unit==="pct"?x.pct:unit==="pips"?x.pips:unit==="lot"?x.lots:x.profit}).map(function(v){return isFinite(v)?v:0});
  var mn=Math.min(0,Math.min.apply(null,vals)),mx=Math.max(0,Math.max.apply(null,vals));if(mn===mx)mx=1;
  var step=niceStep((mx-mn)/5),lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  var y=function(v){return T+(hi-v)/(hi-lo)*(H-T-B)};
  var axisCol="rgba(234,241,255,.55)",grid="rgba(255,255,255,.08)";
  var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Sloupcový graf výsledků">',dec=step<1?(step<0.1?2:1):0;
  for(var v=lo;v<=hi+step/2;v+=step){var yy=y(v);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'" stroke="'+(Math.abs(v)<1e-9?axisCol:grid)+'"/>'+
    '<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="14" fill="'+axisCol+'">'+num(v,dec)+(unit==="pct"?"%":unit==="usd"?"$":"")+'</text>'}

  var slot=(W-L-R)/Math.max(b.length,1),bw=Math.min(54,slot*0.58);

function toNum(s){if(s==null)return NaN;s=String(s).replace(/[\s $]/g,"");if(/^-?[\d.]*,\d+$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/,/g,"");return parseFloat(s)}
function toDate(s,mf){
  s=String(s||"").trim();if(!s)return null;var m;
  if(m=s.match(/^(\d{4})[.\-/](\d{1,2})[.\-/](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/))return new Date(+m[1],m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  if(m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))return mf?new Date(+m[3],m[1]-1,+m[2],+(m[4]||0),+(m[5]||0),+(m[6]||0)):new Date(+m[3],m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))return new Date(+m[3],m[1]-1,+m[2],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  var d=new Date(s);return isNaN(d)?null:d;
}
function rowsFromText(txt){
  if(/<table/i.test(txt)){var doc=new DOMParser().parseFromString(txt,"text/html"),out=[];
    doc.querySelectorAll("tr").forEach(function(tr){var cells=[];tr.querySelectorAll("th,td").forEach(function(c){var n=+(c.getAttribute("colspan")||1);cells.push(c.textContent.trim());for(var i=1;i<n;i++)cells.push("")});out.push(cells)});return out}
  var lines=txt.split(/\r?\n/).filter(function(l){return l.trim()});if(!lines.length)return [];
  var first=lines[0],d=first.split("\t").length>1?"\t":first.split(";").length>first.split(",").length?";":",";
  return lines.map(function(l){var r=[],cur="",q=false;for(var i=0;i<l.length;i++){var c=l[i];if(c==='"'){q=!q;continue}if(c===d&&!q){r.push(cur.trim());cur="";continue}cur+=c}r.push(cur.trim());return r});
}
function parseTrades(txt){
  var rows=rowsFromText(txt),res=[],col=null,mf=false;
  rows.forEach(function(r){r.forEach(function(c){var m=String(c).match(/^(\d{1,2})\.(\d{1,2})\.\d{4}/);if(m){if(+m[2]>12)mf=true;}})});
  for(var i=0;i<rows.length;i++){
    var r=rows[i],low=r.map(function(c){return c.toLowerCase()});
    if(low.some(function(c){return /^(profit|zisk|net profit|p\/l|pips?)$/.test(c)})&&low.some(function(c){return /time|date|datum|čas/.test(c)})&&low.length>=4){
      col={time:[],price:[]};
      low.forEach(function(c,j){
        if(/close.?(time|date)|čas uzav/.test(c))col.close=j;
        else if(/open.?(time|date)/.test(c))col.time.push(j);
        else if(/^(time|date|datum|čas)$/.test(c))col.time.push(j);
        if(/symbol|^item$|instrument|nástroj/.test(c))col.sym=j;
        if(/^(type|action|direction|typ|směr)$/.test(c))col.type=j;
        if(/volume|^lots?$|^units|objem|size/.test(c)&&col.vol==null)col.vol=j;
        if(/^pips?$/.test(c))col.pips=j;
        if(/^(profit|zisk|net profit|p\/l)$/.test(c))col.profit=j;
        if(/commission|komise|provize/.test(c))col.comm=j;
        if(/^(pct|gain %?|výnos %?)$/.test(c))col.pct=j;
        if(/^swap/.test(c))col.swap=j;
        if(/close.?price/.test(c))col.cprice=j;else if(/open.?price/.test(c))col.oprice=j;else if(/^price$|^cena$/.test(c))col.price.push(j);
      });
      if(col.close==null&&col.time.length>1)col.close=col.time[col.time.length-1];
      if(col.close==null)col.close=col.time[0];
      if(col.oprice==null&&col.price.length)col.oprice=col.price[0];
      if(col.cprice==null&&col.price.length>1)col.cprice=col.price[col.price.length-1];
      continue;
    }
    if(!col)continue;
    var type=col.type!=null?String(r[col.type]||"").toLowerCase():"";
    if(col.type!=null&&!/buy|sell|nákup|prodej/.test(type))continue;
    if(col.sym!=null&&!/xau|gold/i.test(r[col.sym]||""))continue;
    var dt=toDate(r[col.close],mf);if(!dt)continue;
    var lots=col.vol!=null?toNum(r[col.vol]):0,pips=col.pips!=null?toNum(r[col.pips]):NaN;
    if(!isFinite(pips)&&col.oprice!=null&&col.cprice!=null){var op=toNum(r[col.oprice]),cp=toNum(r[col.cprice]);if(isFinite(op)&&isFinite(cp))pips=(cp-op)*(/sell|prodej/.test(type)?-1:1)/0.01}
    var profit=col.profit!=null?toNum(r[col.profit]):NaN;
    if(isFinite(profit)){
      if(col.comm!=null&&isFinite(toNum(r[col.comm])))profit+=toNum(r[col.comm]);
      if(col.swap!=null&&isFinite(toNum(r[col.swap])))profit+=toNum(r[col.swap]);
    }else if(isFinite(pips)&&isFinite(lots)&&lots>0){profit=pips*lots}  /* zisk skrytý: u zlata 1 pip × 1 lot = 1 USD */
    else continue;
    res.push({t:dt.toISOString(),side:/sell|prodej/.test(type)?"sell":"buy",lots:isFinite(lots)?lots:0,pips:isFinite(pips)?Math.round(pips*10)/10:0,profit:Math.round(profit*100)/100,pct:col.pct!=null&&r[col.pct]!==""?toNum(r[col.pct]):undefined});
  }
  return res;
}
function demoTrades(seed,edge){
  var out=[],d=new Date();d.setHours(0,0,0,0);var x=seed;function rnd(){x=(x*9301+49297)%233280;return x/233280}
  for(var i=900;i>=0;i--){var day=new Date(d);day.setDate(d.getDate()-i);var wd=day.getDay();if(wd===0||wd===6)continue;
    var n=Math.floor(rnd()*4);for(var k=0;k<n;k++){var win=rnd()<edge,lots=Math.round((0.01+rnd()*0.03)*100)/100,pips=Math.round((win?20+rnd()*120:-(20+rnd()*100))*10)/10;
      var t=new Date(day);t.setHours(8+Math.floor(rnd()*12),Math.floor(rnd()*60));
      out.push({t:t.toISOString(),side:rnd()<.5?"buy":"sell",lots:lots,pips:pips,profit:Math.round(pips*lots*10*100)/100})}}
  return out;
}

    '<label class="f">Začátek vyhodnocení obchodů XAUUSD<input type="datetime-local" id="eStart" value="'+esc(S.start)+'" required></label>'+
    '<label class="f">Počáteční kapitál (USD)<input type="number" step="any" min="0" id="eCap" value="'+esc(S.capital)+'" required></label>'+
    '<label class="f">Koeficient – robotické obchodování<input type="number" step="any" min="0" id="eCoefR" value="'+esc(S.coefRobot!=null?S.coefRobot:S.coef)+'" required></label>'+
    '<label class="f">Koeficient – manuální obchodování<input type="number" step="any" min="0" id="eCoefM" value="'+esc(S.coefManual!=null?S.coefManual:S.coef)+'" required></label>'+
    '<div class="f"><span class="lrow"><label for="eRU">Odkaz – Robotické obchodování</label><button type="button" class="act mini" data-x="upd" data-side="robot">Aktualizovat</button></span><input type="url" id="eRU" value="'+esc(S.robotUrl)+'" placeholder="https://…"></div>'+
    '<div class="f"><span class="lrow"><label for="eMU">Odkaz – Manuální obchodování</label><button type="button" class="act mini" data-x="upd" data-side="manual">Aktualizovat</button></span><input type="url" id="eMU" value="'+esc(S.manualUrl)+'" placeholder="https://…"></div>'+
    '<label class="f">Aktuální stav – robot (USD, ručně)<input type="number" step="any" id="eRB" value="'+esc(S.robotBalance)+'" placeholder="nezadáno"></label>'+
    '<label class="f">Aktuální stav – manuál (USD, ručně)<input type="number" step="any" id="eMB" value="'+esc(S.manualBalance)+'" placeholder="nezadáno"></label>'+
   '</div><p class="hint">Koeficient násobí čistý zisk: 1 = beze změny, 0,8 = o 20 % méně (např. +10 % se zobrazí jako +8 %). Ztráta se počítá celá. Heslo si uživatel mění sám tlačítkem Změnit heslo.</p><div class="row" style="margin-top:10px"><button class="act">Uložit nastavení</button></div></form>'+
   '<h4>Obchody</h4><p class="hint">Robot: '+sel.trades.robot.length+' obchodů · Manuál: '+sel.trades.manual.length+' obchodů. Nahrajte export z Myfxbooku (CSV) nebo report z MetaTraderu (HTML), případně vložte tabulku jako text. Započítají se jen obchody na XAUUSD.</p>'+
   '<div class="grid2" style="margin-top:10px"><label class="f">Stojánek<select id="iSide"><option value="robot">Robotické obchodování</option><option value="manual">Manuální obchodování</option></select></label>'+
   '<label class="f">Soubor<input type="file" id="iFile" accept=".csv,.txt,.htm,.html,.tsv"></label></div>'+
   '<label class="f" style="margin-top:10px">Nebo vložte obsah<textarea id="iTxt" placeholder="Close Time,Symbol,Action,Lots,Pips,Profit&#10;2026.11.06 14:20,XAUUSD,Buy,0.10,35.2,35.20"></textarea></label>'+
   '<div class="row" style="margin-top:10px"><label class="row" style="font-size:14px"><input type="checkbox" id="iRepl" checked> Nahradit stávající obchody</label></div>'+
   '<div class="row" style="margin-top:10px"><button class="act" data-x="imp">Importovat</button><button class="act ghost" data-x="fetch">Načíst z odkazu</button><button class="act ghost" data-x="demo">Vložit ukázková data</button><button class="act danger" data-x="clr">Smazat obchody</button></div>'+
   '<p class="hint" id="iMsg"></p></div></div></div>';
}
function closeOv(){adminOpen=false;if(ov){ov.remove();ov=null}if(session)renderMain()}
var armed={};
function arm(btn,key,label,fn){if(armed[key]){clearTimeout(armed[key]);armed[key]=null;fn();return}btn.textContent=label;armed[key]=setTimeout(function(){armed[key]=null;if(adminOpen)renderAdmin()},4000)}
function msg(m){var el=document.getElementById("iMsg");if(el)el.textContent=m}
async function adminClick(e){
  var b=e.target.closest("button");if(!b)return;var x=b.dataset.x;if(!x)return;e.preventDefault();
  var sel=DB.users.find(function(u){return u.id===adminSel});
  if(x==="close")return closeOv();
  if(x==="sel"){adminSel=b.dataset.id;return renderAdmin()}
  if(x==="view"){viewId=sel.id===me().id?null:sel.id;return closeOv()}
  if(x==="del")return arm(b,"del","Opravdu smazat "+sel.username+"?",async function(){
    try{await userRef(sel.id).collection("trades").doc("robot").delete();await userRef(sel.id).collection("trades").doc("manual").delete();await userRef(sel.id).delete()}catch(err){return fail(err)}
    DB.users=DB.users.filter(function(u){return u.id!==sel.id});if(viewId===sel.id)viewId=null;adminSel=me().id;renderAdmin();renderMain();toast("Účet "+sel.username+" smazán.")});
  if(x==="clr"){var side=val("iSide");return arm(b,"clr","Opravdu smazat ("+(side==="robot"?"robot":"manuál")+")?",async function(){sel.trades[side]=[];await persistTrades(sel,side);renderAdmin();renderMain();toast("Obchody smazány.")})}
  if(x==="export"){var s=JSON.stringify({users:DB.users.map(function(u){return {username:u.username,settings:u.settings,transfer:u.transfer,trades:u.trades}})});
    try{await navigator.clipboard.writeText(s);toast("Záloha zkopírována do schránky.")}catch(err){var t=document.getElementById("bk");t.value=s;t.select();toast("Záloha je v poli, zkopírujte ji.")}return}
  if(x==="import"){var d;try{d=JSON.parse(val("bk"));if(!d||!Array.isArray(d.users))throw 0}catch(err){toast("Záloha není platná.");return}
    var ok=0,miss=[];
    for(var i=0;i<d.users.length;i++){var src=d.users[i],tgt=DB.users.find(function(u){return u.username.toLowerCase()===String(src.username||"").toLowerCase()});
      if(!tgt){miss.push(src.username);continue}
      if(src.settings)tgt.settings=Object.assign(tgt.settings,src.settings);if(src.transfer)tgt.transfer=Object.assign(tgt.transfer,src.transfer);
      if(src.trades){tgt.trades.robot=src.trades.robot||[];tgt.trades.manual=src.trades.manual||[]}
      await userRef(tgt.id).update({settings:tgt.settings,transfer:tgt.transfer}).catch(fail);await persistTrades(tgt,"robot");await persistTrades(tgt,"manual");ok++}
    renderAdmin();renderMain();toast("Obnoveno účtů: "+ok+(miss.length?". Nenalezeno: "+miss.join(", "):""));return}
  if(x==="demo"){var side2=val("iSide");sel.trades[side2]=demoTrades(side2==="robot"?7:19,side2==="robot"?.66:.58);await persistTrades(sel,side2);renderAdmin();renderMain();toast("Ukázková data vložena.");return}
  if(x==="imp"){var f=document.getElementById("iFile").files[0],txt=val("iTxt");if(f)txt=await f.text();if(!txt.trim()){msg("Vyberte soubor nebo vložte obsah.");return}return applyImport(sel,txt)}
  if(x==="upd"){
    var us=b.dataset.side,uu=val(us==="robot"?"eRU":"eMU").trim();
    if(!/^https?:\/\//i.test(uu)){toast("Nejdřív zadejte odkaz začínající https://");return}
    if(sel.settings[us==="robot"?"robotUrl":"manualUrl"]!==uu){sel.settings[us==="robot"?"robotUrl":"manualUrl"]=uu;persistSettings(sel)}
    document.getElementById("iSide").value=us;
    var lbl=b.textContent;b.disabled=true;b.textContent="Načítám…";
    var res=await refreshFrom(sel,us,uu);
    b.disabled=false;b.textContent=lbl;
    if(!res.ok){msg(res.msg);toast(res.msg);var t=document.getElementById("iMsg");if(t)t.scrollIntoView({behavior:"smooth",block:"center"})}
    return;
  }
  if(x==="fetch"){var sd=val("iSide"),url=sd==="robot"?sel.settings.robotUrl:sel.settings.manualUrl;if(!url){msg("Pro tento stojánek není zadaný odkaz.");return}
    msg("Načítám…");try{var r=await fetch(url);if(!r.ok)throw new Error(r.status);await applyImport(sel,await r.text())}catch(err){msg("Stránku se nepodařilo načíst. Server odkazu nepovoluje čtení z jiné stránky. Otevřete odkaz, uložte export a nahrajte ho jako soubor.")}}
}
async function fetchTrades(url){
  var r=await fetch(url+(url.indexOf("?")>-1?"&":"?")+"_="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("HTTP "+r.status);
  return parseTrades(await r.text());
}
/* Obchody načtené z odkazu se neukládají do databáze – při každém otevření a každou celou hodinu se načtou znovu. */
async function refreshFrom(sel,side,url){
  var t;
  try{t=await fetchTrades(url)}
  catch(err){return {ok:false,msg:"Odkaz se nepodařilo načíst automaticky. Web odkazu (např. Myfxbook) nepovoluje čtení z jiné stránky. Použijte odkaz na soubor s obchody v repozitáři, nebo nahrajte export v části Obchody."}}
  if(!t.length)return {ok:false,msg:"Odkaz se načetl, ale nejsou v něm žádné obchody XAUUSD v tabulce s časem a ziskem nebo pipy."};
  var before=sel.trades[side].length;sel.trades[side]=t;
  stampUpd();renderAdmin();renderMain();
  var m="Aktualizováno ("+(side==="robot"?"robot":"manuál")+"): "+t.length+" obchodů, dříve "+before+".";
  msg(m);toast(m);return {ok:true};
}
var lastUpd="",hourTimer=null;
function stampUpd(){var d=new Date();lastUpd="Data aktualizována "+pad(d.getHours())+":"+pad(d.getMinutes());var el=document.getElementById("lastUpd");if(el)el.textContent=lastUpd}
async function autoRefresh(){
  if(DEMO||!session)return;
  var cache={},changed=false,any=false;
  for(var i=0;i<DB.users.length;i++){var u=DB.users[i];
    for(var side of ["robot","manual"]){
      var url=(side==="robot"?u.settings.robotUrl:u.settings.manualUrl)||"";
      if(!/^https?:\/\//i.test(url))continue;
      if(!(url in cache)){try{cache[url]=await fetchTrades(url)}catch(e){cache[url]=null}}
      var t=cache[url];if(!t||!t.length)continue;any=true;
      var cur=u.trades[side]||[];
      if(cur.length===t.length&&cur.length&&cur[cur.length-1].t===t[t.length-1].t)continue;
      u.trades[side]=t;changed=true;
    }}
  if(any)stampUpd();
  if(changed&&session){renderMain();if(adminOpen)renderAdmin()}
}
function scheduleHourly(){
  clearTimeout(hourTimer);
  var now=new Date(),next=new Date(now);next.setHours(now.getHours()+1,0,5,0);
  hourTimer=setTimeout(function(){autoRefresh();scheduleHourly()},next-now);
}
async function applyImport(sel,txt){
  var side=val("iSide"),t=parseTrades(txt);
  if(!t.length){msg("Nenašel jsem žádné obchody XAUUSD. Tabulka musí mít sloupce s časem a ziskem (Profit).");return}
  if(document.getElementById("iRepl").checked)sel.trades[side]=t;
  else{var seen={};sel.trades[side].forEach(function(o){seen[o.t+"|"+o.profit+"|"+o.lots]=1});t.forEach(function(o){if(!seen[o.t+"|"+o.profit+"|"+o.lots])sel.trades[side].push(o)})}
  await persistTrades(sel,side);renderAdmin();renderMain();msg("Importováno "+t.length+" obchodů.");toast("Importováno "+t.length+" obchodů.");
}
async function adminSubmit(e){
  e.preventDefault();var f=e.target;
  if(f.id==="fPw"){
    if(val("pNew")!==val("pNew2")){setErr("pErr","Nová hesla se neshodují.");return}
    busy(f,true);
    try{var u=auth.currentUser,cr=firebase.auth.EmailAuthProvider.credential(u.email,val("pOld"));await u.reauthenticateWithCredential(cr);await u.updatePassword(val("pNew"));closeOv();toast("Heslo změněno.")}
    catch(err){busy(f,false);setErr("pErr",errText(err))}
    return;
  }
  var sel=DB.users.find(function(u){return u.id===adminSel});
  if(f.id==="fNew"){
    var n=val("nU").trim();
    if(!validName(n)){toast("Jméno: 3–30 znaků, písmena bez diakritiky, číslice, tečka, pomlčka, podtržítko.");return}
    if(DB.users.some(function(u){return u.username.toLowerCase()===n.toLowerCase()})){toast("Toto jméno už existuje.");return}
    busy(f,true);
    try{
      var sec=firebase.apps.find(function(a){return a.name==="secondary"})||firebase.initializeApp(FIREBASE_CONFIG,"secondary");
      await sec.auth().setPersistence(firebase.auth.Auth.Persistence.NONE);
      var c=await sec.auth().createUserWithEmailAndPassword(emailOf(n),val("nP")),id=c.user.uid;await sec.auth().signOut();
      var df=defaults();await userRef(id).set({username:n,isAdmin:false,settings:df.settings,transfer:df.transfer,createdAt:new Date().toISOString()});
      DB.users.push({id:id,username:n,isAdmin:false,settings:df.settings,transfer:df.transfer,trades:{robot:[],manual:[]}});
      adminSel=id;renderAdmin();toast("Účet "+n+" založen.");
    }catch(err){busy(f,false);toast(errText(err))}
    return;
  }
  if(f.id==="fSet"){var S=sel.settings;S.start=val("eStart");S.capital=+val("eCap");S.coefRobot=+val("eCoefR");S.coefManual=+val("eCoefM");S.robotUrl=val("eRU").trim();S.manualUrl=val("eMU").trim();S.robotBalance=val("eRB");S.manualBalance=val("eMB");
    await persistSettings(sel);renderAdmin();renderMain();toast("Nastavení uloženo.")}
}

/* ---------- start ---------- */
if(DEMO){
  var df=defaults(),d=new Date();d.setMonth(d.getMonth()-5);df.settings.start=toLocalInput(d);df.settings.robotUrl="https://www.myfxbook.com/";df.settings.manualUrl="https://www.myfxbook.com/";
  DB.users=[{id:"demo",username:"ukazka",isAdmin:false,settings:df.settings,transfer:df.transfer,trades:{robot:demoTrades(7,.66),manual:demoTrades(19,.58)}}];
  session="demo";render();toast("Ukázkový režim – data se neukládají.");
}else if(!FIREBASE_CONFIG.apiKey||!FIREBASE_CONFIG.projectId){
  renderMsg("Chybí nastavení Firebase","Otevřete tento soubor v textovém editoru a v horní části do <b>FIREBASE_CONFIG</b> vložte konfiguraci svého projektu z Firebase konzole.");
}else if(typeof firebase==="undefined"){
  renderMsg("Firebase se nenačetl","Knihovnu Firebase se nepodařilo stáhnout. Zkontrolujte připojení k internetu. Uvnitř náhledu v Claude se Firebase spustit nedá, stránku nahrajte na vlastní web (např. GitHub Pages).");
}else{
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();
  renderMsg("Načítám…","Připojuji se k Firebase.");
  auth.onAuthStateChanged(onAuth);
}
})();
</script>
