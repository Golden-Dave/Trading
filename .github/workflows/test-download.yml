name: Test stažení výpisu
on:
  push:
    paths: [".github/workflows/test-download.yml", "tools/api_probe.py"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zkouška API Myfxbooku
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: python3 tools/api_probe.py
